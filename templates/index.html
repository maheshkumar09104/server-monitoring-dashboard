<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitoring Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --panel: #0f1729;
            --border: #1e2d4a;
            --accent: #00d4ff;
            --green: #00ff88;
            --yellow: #ffcc00;
            --red: #ff4466;
            --text: #c8d8f0;
            --dim: #4a6080;
            --glow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
        }

        .header-left h1 span {
            color: var(--accent);
        }

        .header-left p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--dim);
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--green); }
            50% { opacity: 0.4; box-shadow: none; }
        }

        /* Metric Cards Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--card-color, var(--accent));
            opacity: 0.8;
        }

        .metric-card:hover {
            border-color: rgba(0,212,255,0.3);
            box-shadow: var(--glow);
        }

        .metric-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--dim);
            margin-bottom: 16px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Circle Progress */
        .circle-wrap {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .circle-progress {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .circle-progress svg {
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .circle-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 5;
        }

        .circle-fill {
            fill: none;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 0.8s ease, stroke 0.5s ease;
        }

        .circle-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            color: #fff;
        }

        .metric-info {
            flex: 1;
        }

        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            margin-bottom: 6px;
        }

        .metric-value span {
            font-size: 1rem;
            color: var(--dim);
        }

        .metric-status {
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            padding: 3px 8px;
            border-radius: 3px;
            display: inline-block;
            margin-top: 6px;
        }

        .status-ok { background: rgba(0,255,136,0.1); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
        .status-warn { background: rgba(255,204,0,0.1); color: var(--yellow); border: 1px solid rgba(255,204,0,0.3); }
        .status-crit { background: rgba(255,68,102,0.1); color: var(--red); border: 1px solid rgba(255,68,102,0.3); }

        /* Uptime Card */
        .uptime-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .uptime-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--dim);
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 6px;
        }

        .uptime-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.6rem;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .uptime-breakdown {
            display: flex;
            gap: 24px;
        }

        .uptime-unit {
            text-align: center;
        }

        .uptime-num {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.8rem;
            color: #fff;
            display: block;
        }

        .uptime-unit-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--dim);
            text-transform: uppercase;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .footer-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--dim);
            letter-spacing: 1px;
        }

        #last-updated {
            color: var(--accent);
        }

        /* Animate in */
        .metric-card {
            animation: fadeUp 0.5s ease both;
        }
        .metric-card:nth-child(1) { animation-delay: 0.1s; }
        .metric-card:nth-child(2) { animation-delay: 0.2s; }
        .metric-card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            .metrics-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
	#toggle-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid var(--red);
    background: rgba(255,68,102,0.1);
    color: var(--red);
    cursor: pointer;
    transition: all 0.3s;
}
#toggle-btn:hover {
    background: rgba(255,68,102,0.25);
}
#toggle-btn.running {
    border-color: var(--green);
    background: rgba(0,255,136,0.1);
    color: var(--green);
}
    </style>
</head>

<body>
<div class="container">

    <header>
        <div class="header-left">
            <h1>SERVER <span>MONITOR</span></h1>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
    <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">SYSTEM ONLINE</span>
    </div>
    <button id="toggle-btn" onclick="toggleMonitoring()">⏹ STOP</button>
</div>
    </header>

    <div class="metrics-grid">

        <!-- CPU Card -->
        <div class="metric-card" style="--card-color: #00d4ff;">
            <div class="metric-label">⬡ CPU Usage</div>
            <div class="circle-wrap">
                <div class="circle-progress">
                    <svg viewBox="0 0 80 80">
                        <circle class="circle-bg" cx="40" cy="40" r="35"/>
                        <circle class="circle-fill" id="cpu-circle" cx="40" cy="40" r="35" stroke="#00d4ff"/>
                    </svg>
                    <div class="circle-text" id="cpu-circle-text">0%</div>
                </div>
                <div class="metric-info">
                    <div class="metric-value"><span id="cpu">--</span><span>%</span></div>
                    <div class="metric-status status-ok" id="cpu-status">NORMAL</div>
                </div>
            </div>
        </div>

        <!-- Memory Card -->
        <div class="metric-card" style="--card-color: #00ff88;">
            <div class="metric-label">⬡ Memory Usage</div>
            <div class="circle-wrap">
                <div class="circle-progress">
                    <svg viewBox="0 0 80 80">
                        <circle class="circle-bg" cx="40" cy="40" r="35"/>
                        <circle class="circle-fill" id="mem-circle" cx="40" cy="40" r="35" stroke="#00ff88"/>
                    </svg>
                    <div class="circle-text" id="mem-circle-text">0%</div>
                </div>
                <div class="metric-info">
                    <div class="metric-value"><span id="memory">--</span><span>%</span></div>
                    <div class="metric-status status-ok" id="mem-status">NORMAL</div>
                </div>
            </div>
        </div>

        <!-- Disk Card -->
        <div class="metric-card" style="--card-color: #ffcc00;">
            <div class="metric-label">⬡ Disk Usage</div>
            <div class="circle-wrap">
                <div class="circle-progress">
                    <svg viewBox="0 0 80 80">
                        <circle class="circle-bg" cx="40" cy="40" r="35"/>
                        <circle class="circle-fill" id="disk-circle" cx="40" cy="40" r="35" stroke="#ffcc00"/>
                    </svg>
                    <div class="circle-text" id="disk-circle-text">0%</div>
                </div>
                <div class="metric-info">
                    <div class="metric-value"><span id="disk">--</span><span>%</span></div>
                    <div class="metric-status status-ok" id="disk-status">NORMAL</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Uptime Card -->
    <div class="uptime-card">
        <div>
            <div class="uptime-label">⬡ System Uptime</div>
            <div class="uptime-value" id="uptime-raw">--</div>
        </div>
        <div class="uptime-breakdown">
            <div class="uptime-unit">
                <span class="uptime-num" id="uptime-days">--</span>
                <span class="uptime-unit-label">Days</span>
            </div>
            <div class="uptime-unit">
                <span class="uptime-num" id="uptime-hours">--</span>
                <span class="uptime-unit-label">Hours</span>
            </div>
            <div class="uptime-unit">
                <span class="uptime-num" id="uptime-mins">--</span>
                <span class="uptime-unit-label">Mins</span>
            </div>
            <div class="uptime-unit">
                <span class="uptime-num" id="uptime-secs">--</span>
                <span class="uptime-unit-label">Secs</span>
            </div>
        </div>
    </div>
<div class="metric-card" style="margin-bottom:24px; --card-color:#a78bfa;">
    <div class="metric-label">⬡ Live History (Last 20 Readings)</div>
    <canvas id="historyChart" height="100"></canvas>
</div>

    <div class="footer">
        <span class="footer-text">MAHESH KUMAR // SERVER MONITORING DASHBOARD v2.0</span>
        <span class="footer-text">LAST UPDATED: <span id="last-updated">--</span></span>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
